<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f7d46"/>
      <stop offset="45%" stop-color="#33582f"/>
      <stop offset="100%" stop-color="#1c3520"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="82%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#c9e29b" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#c9e29b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#sky)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <rect width="800" height="1000" fill="url(#glow2)"/>

  <!-- distant tree silhouettes, soft and dark -->
  <g opacity=".35" fill="#152b18">
    <path d="M40,140 L90,40 L140,140 Z"/>
    <path d="M110,150 L165,30 L220,150 Z"/>
    <path d="M600,120 L655,15 L710,120 Z"/>
    <path d="M690,150 L740,55 L790,150 Z"/>
    <path d="M0,860 L55,760 L110,860 Z"/>
    <path d="M700,900 L755,800 L810,900 Z"/>
  </g>

  <!-- mid trees, left edge -->
  <g fill="#20421f">
    <rect x="18" y="230" width="14" height="70" fill="#4a3520"/>
    <path d="M-10,255 L25,150 L60,255 Z"/>
    <path d="M0,220 L25,140 L50,220 Z" fill="#2c5029"/>

    <rect x="-4" y="470" width="16" height="80" fill="#4a3520"/>
    <path d="M-40,500 L4,380 L48,500 Z"/>
    <path d="M-25,460 L4,370 L33,460 Z" fill="#2c5029"/>

    <rect x="24" y="700" width="16" height="90" fill="#4a3520"/>
    <path d="M-16,730 L32,600 L80,730 Z"/>
    <path d="M0,690 L32,590 L64,690 Z" fill="#2c5029"/>
  </g>

  <!-- mid trees, right edge -->
  <g fill="#20421f">
    <rect x="762" y="210" width="14" height="70" fill="#4a3520"/>
    <path d="M735,235 L770,130 L805,235 Z"/>
    <path d="M748,200 L770,120 L792,200 Z" fill="#2c5029"/>

    <rect x="778" y="440" width="16" height="80" fill="#4a3520"/>
    <path d="M746,470 L790,350 L834,470 Z"/>
    <path d="M761,430 L790,340 L819,430 Z" fill="#2c5029"/>

    <rect x="748" y="670" width="16" height="90" fill="#4a3520"/>
    <path d="M712,700 L760,570 L808,700 Z"/>
    <path d="M728,660 L760,560 L792,660 Z" fill="#2c5029"/>
  </g>

  <!-- foreground bushes / underbrush, bottom -->
  <g fill="#2a4f28" opacity=".85">
    <ellipse cx="70" cy="960" rx="90" ry="34"/>
    <ellipse cx="220" cy="985" rx="70" ry="26"/>
    <ellipse cx="600" cy="975" rx="85" ry="30"/>
    <ellipse cx="740" cy="950" rx="75" ry="28"/>
  </g>
  <g fill="#3a6633" opacity=".7">
    <ellipse cx="130" cy="945" rx="60" ry="22"/>
    <ellipse cx="670" cy="935" rx="55" ry="20"/>
  </g>

  <!-- little flowers scattered for the fairytale-garden feel -->
  <g fill="#f4d9e2" opacity=".8">
    <circle cx="60" cy="330" r="4"/>
    <circle cx="80" cy="325" r="4"/>
    <circle cx="70" cy="315" r="4"/>
    <circle cx="735" cy="300" r="4"/>
    <circle cx="755" cy="295" r="4"/>
    <circle cx="745" cy="285" r="4"/>
    <circle cx="45" cy="620" r="4"/>
    <circle cx="65" cy="615" r="4"/>
    <circle cx="760" cy="600" r="4"/>
    <circle cx="780" cy="595" r="4"/>
  </g>

  <!-- soft floating light specks -->
  <g fill="#fff6d8" opacity=".5">
    <circle cx="150" cy="120" r="3"/>
    <circle cx="300" cy="60" r="2.4"/>
    <circle cx="500" cy="90" r="3"/>
    <circle cx="650" cy="180" r="2.4"/>
    <circle cx="200" cy="500" r="2.6"/>
    <circle cx="600" cy="520" r="2.6"/>
    <circle cx="380" cy="850" r="3"/>
    <circle cx="120" cy="800" r="2.2"/>
  </g>
</svg>
